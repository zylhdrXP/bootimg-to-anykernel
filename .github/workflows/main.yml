name: Run Telegram Repacker Bot

on:
  schedule:
    # Trigger every 5 hours to stay within the 6-hour workflow execution limit
    - cron: '0 */5 * * *'
  workflow_dispatch:

# Ensure only one instance of the bot runs at any time. 
# New runs will cancel the old ones to prevent double-polling conflicts.
concurrency:
  group: telegram-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip cpio

    - name: Run Bot
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
        TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        OWNER_ID: ${{ secrets.OWNER_ID }}
        ANYKERNEL_REPO: ${{ secrets.ANYKERNEL_REPO }}
        ANYKERNEL_BRANCH: ${{ secrets.ANYKERNEL_BRANCH }}
      run: |
        python bot.py
